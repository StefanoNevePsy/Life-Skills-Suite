name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - source-reconstruction
      - 'feature/**'
  workflow_dispatch:

# Permessi necessari per il deployment su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          cp -r index.html assets _site/
          if [ -d "thermometer" ]; then cp -r thermometer _site/; fi
          if [ -d "public/thermometer" ]; then cp -r public/thermometer _site/; fi
          if [ -d "fotolinguaggio" ]; then cp -r fotolinguaggio _site/; fi
          if [ -d "public/fotolinguaggio" ]; then cp -r public/fotolinguaggio _site/; fi
          if [ -f "life_skills.png" ]; then cp life_skills.png _site/; fi
          if [ -f "ruota_.png" ]; then cp ruota_.png _site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
